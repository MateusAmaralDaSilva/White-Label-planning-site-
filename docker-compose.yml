services:
  db:
    image: postgres:16-alpine
    container_name: whitelabel-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrator:
    image: postgres:16-alpine
    container_name: whitelabel-migrator
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/db/migrations:/migrations:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until pg_isready -h db -U postgres; do sleep 1; done;
      if [ "$(psql -h db -U postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='whitelabel'\")" != '1' ]; then
        psql -h db -U postgres -d postgres -c "CREATE DATABASE whitelabel;";
      fi;
      for f in /migrations/*.sql; do
        echo "Applying $f";
        psql -h db -U postgres -d whitelabel -f "$f" || exit 1;
      done;
      # atualiza a senha da role da aplicacao
      psql -h db -U postgres -d whitelabel -c "ALTER ROLE whitelabel_app WITH PASSWORD '$APP_DB_PASSWORD';"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: whitelabel-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://whitelabel_app:${APP_DB_PASSWORD}@db:5432/whitelabel
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: whitelabel-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
