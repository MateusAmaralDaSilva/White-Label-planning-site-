name: aubi

services:
  db:
    image: postgres:18-alpine
    container_name: aubi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    image: postgres:18-alpine
    container_name: aubi-backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${AUBI_DB_NAME:-aubi}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
      - ./backend/scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
    command: ["/bin/sh", "/usr/local/bin/backup-postgres.sh"]
    restart: unless-stopped

  migrator:
    image: postgres:18-alpine
    container_name: aubi-migrator
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/db/migrations:/migrations:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      AUBI_DB_NAME: ${AUBI_DB_NAME:-aubi}
    command:
      - /bin/sh
      - -c
      - |
          until pg_isready -h db -U postgres; do
            sleep 1
          done

          if [ "$$(psql -h db -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$${AUBI_DB_NAME:-aubi}'")" != "1" ]; then
            psql -h db -U postgres -d postgres -c "CREATE DATABASE \"$${AUBI_DB_NAME:-aubi}\";"
          fi

          psql -h db -U postgres -d "$${AUBI_DB_NAME:-aubi}" -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS public.schema_migrations (filename text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())"

          for f in /migrations/*.sql; do
            name="$$(basename "$$f")"
            if [ "$$(psql -h db -U postgres -d "$${AUBI_DB_NAME:-aubi}" -tAc "SELECT 1 FROM public.schema_migrations WHERE filename='$$name'")" = "1" ]; then
              echo "Skipping already applied $$name"
              continue
            fi
            echo "Applying $$name"
            psql -h db -U postgres -d "$${AUBI_DB_NAME:-aubi}" -v ON_ERROR_STOP=1 -f "$$f" || exit 1
            psql -h db -U postgres -d "$${AUBI_DB_NAME:-aubi}" -v ON_ERROR_STOP=1 -c "INSERT INTO public.schema_migrations (filename) VALUES ('$$name')"
          done

          psql -h db -U postgres -d "$${AUBI_DB_NAME:-aubi}" \
            -v ON_ERROR_STOP=1 -c "ALTER ROLE aubi_app WITH PASSWORD '$$APP_DB_PASSWORD'"
    restart: "no"

  seeder:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aubi-seeder
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${AUBI_DB_NAME:-aubi}
      ADMIN_TEMP_PASSWORD: ${ADMIN_TEMP_PASSWORD}
    command: ["node", "scripts/bootstrap.js"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aubi-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://aubi_app:${APP_DB_PASSWORD}@db:5432/${AUBI_DB_NAME:-aubi}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUST_PROXY: "1"
      ADMIN_TEMP_PASSWORD: ${ADMIN_TEMP_PASSWORD}
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: aubi-frontend
    depends_on:
      - backend
    ports:
      - "27101:80"
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:

networks:
  proxy:
    external: true
